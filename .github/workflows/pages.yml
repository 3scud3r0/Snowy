name: Deploy Snowy Three.js
on:
  push:
    branches: [main, three-rebuild-steep-target]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snowy-three-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor CC0 rigged rider
        if: github.ref == 'refs/heads/three-rebuild-steep-target'
        shell: bash
        run: |
          if [ ! -f public/assets/rider.glb ]; then
            mkdir -p public/assets
            curl -fsSL https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb -o public/assets/rider.glb
            curl -fsSL https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/QUATERNIUS-LICENSE.txt -o public/assets/QUATERNIUS-LICENSE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets/rider.glb public/assets/QUATERNIUS-LICENSE.txt
            git commit -m "Vendor CC0 Quaternius rider model"
            git push origin HEAD:three-rebuild-steep-target
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Upload branch preview
        uses: actions/upload-artifact@v4
        with:
          name: snowy-preview
          path: dist
          retention-days: 2
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
