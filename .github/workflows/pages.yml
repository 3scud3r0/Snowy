name: Deploy Snowy to GitHub Pages

on:
  push:
    branches: [main, master, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Validate vertical slice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and gameplay-core tests
        run: npm run check

  deploy:
    name: Publish GitHub Page
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static artifact
        run: |
          mkdir -p _site/assets
          cp index.html styles.css script.js core.js manifest.webmanifest sw.js _site/
          cp assets/snowy-mark.svg assets/snowy-maskable.svg _site/assets/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
